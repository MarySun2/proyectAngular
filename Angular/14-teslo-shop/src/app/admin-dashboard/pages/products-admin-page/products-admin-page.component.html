<h1 class="text-2xl font-bold"> Listado de  Productos</h1>
<h3 class="text-lg">Total de Productos
  <span class="text-accent">{{productsResource.value()?.count}}</span>
</h3>

<div class="divider"></div>

<!-- Agregar nuevos productos -->
<div class="mb-7 flex fles-1">
<button class="btn btn-primary" routerLink="/admin/products/new">
  Nuevo producto
</button>
</div>

<!-- Las tablas listado-->
<product-table [products]="productsResource.value()?.products ?? []"/>

<div class="divider"></div>

<!-- Paginaion -->
<div class="flex flex-row gap-2 justify-center items-center h-20">
  <app-pagination
  [pages]="productsResource.value()?.pages ?? 0"
  [currentPage]="paginationService.CurrentPage()"
  />

  <select class="select select-bordered w-32"
  (change)="productsPerPage.set(+selectPerPage.value)"
  #selectPerPage
  >
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>
</div>
